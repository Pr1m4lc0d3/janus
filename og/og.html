<style>
  @page { margin: 0; }
  html, body { margin: 0; padding: 0; background: #08080A; }

  .card {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 22% 45%, #17161A 0%, #0C0C0E 46%, #08080A 100%);
    font-kerning: normal;
  }

  /* film grain */
  .grain {
    position: absolute; inset: 0;
    opacity: .16;
    mix-blend-mode: overlay;
    pointer-events: none;
  }

  /* ---- layout: two poles, a gap held open between them ---- */
  .stage {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: 470px 1px 1fr;
    align-items: center;
  }

  .mark { justify-self: center; }

  .seam {
    width: 1px; height: 384px;
    background: linear-gradient(180deg,
      transparent 0%, rgba(200,150,62,.28) 22%, rgba(200,150,62,.44) 50%,
      rgba(200,150,62,.28) 78%, transparent 100%);
  }

  .text { padding-left: 86px; padding-right: 74px; }

  /* ---- type ---- */
  .wordmark {
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 82px;
    line-height: 1;
    letter-spacing: .30em;
    color: #EFE8DB;
    margin: 0 0 26px -2px;
    text-indent: .30em;
    font-weight: 400;
  }

  .rule {
    display: flex; align-items: center; gap: 0;
    width: 330px; margin-bottom: 26px;
  }
  .rule i { display: block; height: 1px; flex: 1; }
  .rule .l { background: linear-gradient(90deg, rgba(200,150,62,.75), rgba(200,150,62,.28)); }
  .rule .r { background: linear-gradient(90deg, rgba(200,150,62,.28), transparent); }
  .rule b {
    width: 5px; height: 5px; border-radius: 50%;
    background: #C8963E; margin: 0 9px; flex: none;
  }

  .kicker {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: .34em;
    color: #8E8878;
    margin: 0 0 40px 0;
    text-transform: uppercase;
  }

  .lede {
    font-family: "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 35px;
    line-height: 1.42;
    color: #D6CFC2;
    margin: 0 0 34px 0;
    max-width: 640px;
  }
  .lede .gold   { color: #E0B463; }
  .lede .silver { color: #C6CBD2; }

  /* the three banned exits — the method, stated */
  .exits {
    display: flex; align-items: center; gap: 15px;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 14.5px;
    letter-spacing: .19em;
    text-transform: uppercase;
    color: #6E6A61;
  }
  .exits s { text-decoration-color: rgba(200,150,62,.65); text-decoration-thickness: 1px; }
  .exits em { font-style: normal; color: #3E3B36; }
</style>

<div class="card">
  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="n">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="stage">
    <!-- ================= the mark ================= -->
    <svg class="mark" width="380" height="440" viewBox="0 0 380 440" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="#F3DAA0"/>
          <stop offset="32%"  stop-color="#CC9B42"/>
          <stop offset="70%"  stop-color="#8F6520"/>
          <stop offset="100%" stop-color="#DDB86E"/>
        </linearGradient>
        <linearGradient id="silver" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#F2F5F8"/>
          <stop offset="34%"  stop-color="#C4C9D0"/>
          <stop offset="72%"  stop-color="#828892"/>
          <stop offset="100%" stop-color="#D6DBE1"/>
        </linearGradient>

      </defs>

      <!-- two crescents: outer arc r=150, inner arc r=260 bulging away from centre.
           The 260 controls the void: larger = thinner void, smaller = fatter void. -->
      <path d="M 190 70 A 150 150 0 0 0 190 370 A 260 260 0 0 1 190 70 Z" fill="url(#gold)"/>
      <path d="M 190 70 A 150 150 0 0 1 190 370 A 260 260 0 0 0 190 70 Z" fill="url(#silver)"/>

      <!-- the held middle: dot + tapering spine, sitting in the void -->
      <circle cx="190" cy="176" r="12.5" fill="url(#gold)"/>
      <path d="M 185.6 200 L 194.4 200 L 191.5 312 L 188.5 312 Z" fill="url(#gold)"/>
    </svg>

    <div class="seam"></div>

    <!-- ================= the type ================= -->
    <div class="text">
      <h1 class="wordmark">JANUS</h1>

      <div class="rule"><i class="l"></i><b></b><i class="r"></i></div>

      <p class="kicker">Product Positioning Skill&nbsp; ·&nbsp; Claude Code</p>

      <p class="lede">
        Two things about your product<br>
        that <span class="gold">contradict</span> each other<br>
        are the <span class="silver">position</span> you were missing.
      </p>

      <div class="exits">
        <s>Compromise</s><em>/</em><s>Sequence</s><em>/</em><s>Segment</s>
      </div>
    </div>
  </div>
</div>
